<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{comandas.titulo}"></title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 40px;
            min-height: 100vh;
            background: radial-gradient(circle at top, #1a0033, #0a0015);
            color: #f2e7ff;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #b16dff;
            letter-spacing: 1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: linear-gradient(145deg, #150028, #240040);
            box-shadow: 0 0 25px rgba(122,44,255,0.2);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 14px;
            text-align: left;
        }

        th {
            background: #3b1173;
            color: #fff;
            font-size: 15px;
        }

        tr {
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(122, 44, 255, 0.15);
        }

        td {
            color: #e6d6ff;
        }

        .btn {
            display: inline-block;
            padding: 6px 12px;
            margin: 2px;
            background: linear-gradient(145deg, #7a2cff, #4b00aa);
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 13px;
            transition: 0.2s;
        }

        .btn:hover {
            background: linear-gradient(145deg, #9b59ff, #5a00cc);
        }

        .btn-danger {
            background: linear-gradient(145deg, #ff4b7d, #b80030);
        }

        .btn-danger:hover {
            background: linear-gradient(145deg, #ff6d99, #d10040);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .erro {
            margin: 15px 0;
            padding: 10px;
            background: rgba(255, 50, 100, 0.15);
            border: 1px solid #ff4b7d;
            border-radius: 6px;
            color: #ff9cb8;
        }

        .status {
            font-weight: bold;
        }

        .status.aberta {
            color: #00ffcc;
        }

        .status.fechada {
            color: #ff6d99;
        }
    </style>
</head>
<body>

<h1>📋 <span th:text="#{comandas.titulo}">Comandas</span></h1>

<div class="top-bar">
    <div></div>
    <a th:href="@{/comandas/novo}" class="btn">➕ <span th:text="#{comandas.nova}">Nova Comanda</span></a>
</div>

<div th:if="${erro}" class="erro">
    <strong th:text="${erro}"></strong>
</div>

<table>
    <thead>
    <tr>
        <th th:text="#{comandas.id}">ID</th>
        <th th:text="#{comandas.mesa}">Mesa</th>
        <th th:text="#{comandas.status}">Status</th>
        <th th:text="#{comandas.total}">Total (R$)</th>
        <th th:text="#{comandas.acoes}">Ações</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="comanda : ${comandas}">
        <td th:text="${comanda.idComanda}"></td>
        <td th:text="${comanda.mesa != null ? comanda.mesa.numero : 'N/A'}"></td>
        <td>
            <span th:switch="${comanda.status}">
                <span th:case="'FECHADA'">❌ <span th:text="#{status.fechada}">Fechada</span></span>
                <span th:case="*">✅ <span th:text="#{status.aberta}">Aberta</span></span>
            </span>
        </td>
        <td th:text="${#numbers.formatDecimal(comanda.calcularTotal(), 1, 'POINT', 2, 'COMMA')}"></td>
        <td>
            <span th:if="${comanda.status != 'FECHADA'}">
                <a th:href="@{/comandas/pedidos/novo(comandaId=${comanda.idComanda})}" class="btn">➕ <span th:text="#{comandas.pedido}">Pedido</span></a>
                <a th:href="@{/comandas/fechar(id=${comanda.idComanda})}" class="btn btn-danger">🔒 <span th:text="#{comandas.fechar}">Fechar</span></a>
            </span>

            <span th:if="${comanda.status == 'FECHADA'}">
                <em style="color:#aaa;" th:text="#{comandas.encerrada}">Encerrada</em>
            </span>
        </td>
    </tr>
    </tbody>
</table>


</body>
</html>
