<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{erro.interno.titulo}"></title>
    <style>
        body {
            margin: 0;
            background: #0d1b2a;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #1b263b;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            width: 450px;
            box-shadow: 0px 0px 20px rgba(0,0,0,0.6);
        }

        h1 {
            color: #e63946;
            margin-bottom: 10px;
        }

        p {
            margin-bottom: 20px;
            color: #ddd;
        }

        a {
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            background: #4cc9f0;
            color: #0d1b2a;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>💥 <span th:text="#{erro.interno.titulo}">Erro Interno</span></h1>
    <p th:text="#{erro.interno.mensagem}">Ocorreu um erro inesperado no sistema.</p>
    <a th:href="@{/dashboard}" th:text="#{erro.interno.voltar}">Voltar</a>
</div>

</body>
</html>
